[project]
name = "sokomesh-api"
description = "SokoMesh API — Django ASGI backend and contract authority"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.111",
    "channels>=4",
    "channels-redis>=4",
    "django>=6.1,<6.2",
    "django-environ>=0.14.0",
    "psycopg[binary,pool]>=3.3.6",
    "redis>=5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1,<6.2",
    "factory-boy>=3.3.3",
    "hypothesis>=6.169.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.ci"
python_files = ["test_*.py"]
addopts = "--strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
include = ["config", "core", "apps", "tests"]
exclude = ["**/migrations"]
