# Paste into the CloudPanel site's Vhost (Sites → Manage → Vhost), inside the `server { … }` block that listens
# on 443, directly above its `location / {` block (docs/deploy-cloudpanel.md, step 7). The browser keeps calling
# /api/* on the site's own origin; NGINX hands those requests straight to Django on 127.0.0.1:8000 instead of
# through the Next.js server. Everything else still goes to the Next.js server on the App Port.

location /api/ {
  # Product photographs are the largest upload (15 MB, contract `uploads`).
  client_max_body_size 20m;
  proxy_pass http://127.0.0.1:8000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
}
