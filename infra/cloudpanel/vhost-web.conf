# Paste into the WEB site's Vhost in CloudPanel (Sites → the main domain → Manage → Vhost), inside its
# `server { … }` block, directly above the `location / {` line (docs/deploy-cloudpanel.md, step 8.4).
#
# The browser calls /api/* on the site's own address, so sign-in cookies stay first-party. Without this block
# the Next.js server would still pass those calls on (as in development); with it, NGINX hands them straight to
# the API site's Django on 127.0.0.1:8000, uploads included, without going through Node.js.

location /api/ {
  # Product photographs are the largest upload (15 MB, contract `uploads`); 25 MB is the API's own ceiling.
  client_max_body_size 26m;
  proxy_pass http://127.0.0.1:8000;   # the API site's App Port (APP_PORT in its .env): change 8000 if yours differs
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
}
